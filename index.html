<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Говнодавы</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#0f0620">
<style>
:root{--ac:#ffb02e;--pk:#ff5fa2;--cy:#5fe0ff;--tx:#f6efff;--mut:#9d8bbd;--glass:rgba(36,22,64,.55);--stroke:rgba(255,255,255,.08);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--tx);font:16px/1.4 system-ui,sans-serif;overflow:hidden;background:#0a0418}
body::before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 15% 20%,rgba(107,63,160,.55) 0,transparent 45%),radial-gradient(circle at 85% 30%,rgba(255,95,162,.35) 0,transparent 45%),radial-gradient(circle at 50% 90%,rgba(95,224,255,.25) 0,transparent 50%),radial-gradient(circle at 20% 80%,rgba(255,176,46,.15) 0,transparent 40%);z-index:-2;animation:bgF 20s ease-in-out infinite;filter:blur(20px)}
@keyframes bgF{50%{transform:translate(-2%,2%) scale(1.05)}}
#app{position:fixed;inset:0;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s}
#app.on{opacity:1;transform:none}
button,input,textarea,select{font:inherit;color:var(--tx)}
input,textarea,select{width:100%;background:rgba(10,4,24,.7);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:13px 15px;margin:5px 0}
input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,176,46,.15)}
button{position:relative;background:linear-gradient(180deg,#ffc24d,#f09a14);color:#2a1600;border:0;border-radius:14px;padding:11px 18px;font-weight:800;cursor:pointer;transition:transform .12s,filter .2s;box-shadow:0 4px 0 #a56200,0 6px 20px rgba(255,176,46,.3),inset 0 1px 0 rgba(255,255,255,.4)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #a56200}
button.g{background:linear-gradient(180deg,#4a376e,#2e2050);color:var(--tx);box-shadow:0 4px 0 #170b2e}
button:disabled{opacity:.45;cursor:not-allowed}
button.big{font-size:22px;padding:16px 40px;border-radius:20px;margin:12px 0;font-family:Impact,sans-serif;letter-spacing:2px}
button.menu-btn{padding:11px 12px;font-size:13px;border-radius:14px;width:100%}
.c{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:460px;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.i{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
.top{display:flex;align-items:center;gap:8px;margin:0 auto 14px;max-width:720px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--stroke);border-radius:18px;padding:8px 12px}
.top b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.cur{font-weight:800;font-size:13px;display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.3);padding:5px 10px;border-radius:20px}
.lg{display:flex;align-items:center;gap:10px;justify-content:center}
.lt{font:900 28px/.95 Impact,sans-serif;background:linear-gradient(180deg,#ffe38a,#ffb02e 50%,#d97700);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1.5px;filter:drop-shadow(0 2px 0 #7a3b00)}
.av{animation:fl 3.5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;max-width:640px;margin:14px auto}
.it{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--stroke);border-radius:18px;padding:12px;text-align:center;font-size:13px;animation:pop .4s both;transition:transform .2s}
.it:hover{transform:translateY(-3px);border-color:rgba(255,176,46,.35)}
.it button{margin-top:8px;padding:7px 10px;font-size:12px;border-radius:10px}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.tabs{display:flex;gap:6px;overflow-x:auto;justify-content:center;margin:10px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:rgba(36,22,64,.6);color:var(--tx);padding:9px 16px;border-radius:12px;font-size:13px;box-shadow:none;border:1px solid var(--stroke);white-space:nowrap}
.tabs button.on{background:linear-gradient(180deg,#ffc24d,#f09a14);color:#2a1600;box-shadow:0 3px 10px rgba(255,176,46,.4)}
.bar{height:12px;background:rgba(10,4,24,.8);border:1px solid var(--stroke);border-radius:99px;overflow:hidden;width:240px;margin:8px auto;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pk),var(--ac),var(--cy));box-shadow:0 0 14px rgba(255,176,46,.6);transition:width .8s ease}
.tag{display:inline-block;background:linear-gradient(135deg,var(--pk),#c4259c);color:#fff;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800;margin-left:6px}
.card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--stroke);border-radius:20px;padding:16px;margin:12px auto;max-width:460px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.back{background:rgba(36,22,64,.5);color:var(--mut);padding:8px 14px;box-shadow:none;border:1px solid var(--stroke);border-radius:12px;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20}
#intro{background:#000;z-index:30;font-family:Georgia,serif;flex-direction:row;overflow:hidden}
#it{font-size:clamp(22px,5vw,40px);max-width:80%;opacity:0;transition:opacity 1.2s;line-height:1.3;text-align:center;position:relative;z-index:3}
#it.num{font-size:120px;font-family:Impact,sans-serif;color:var(--ac);text-shadow:0 0 40px rgba(255,176,46,.6)}
#it.big h1{font:900 clamp(40px,10vw,80px) Impact,sans-serif;background:linear-gradient(180deg,#ffe38a,#ffb02e 50%,#d97700);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7a3b00)}
#it small{color:var(--mut);font-size:.6em}
#skip{position:absolute;right:16px;bottom:16px;background:rgba(255,255,255,.1);color:#fff;z-index:3;padding:8px 14px;font-size:13px;box-shadow:none;border:1px solid rgba(255,255,255,.15)}
.env{width:260px;height:170px;position:relative;transform-style:preserve-3d;animation:sp 4s ease-in-out infinite;cursor:pointer}
@keyframes sp{0%,100%{transform:rotateY(-20deg) rotateX(8deg)}50%{transform:rotateY(20deg) rotateX(-4deg)}}
.env .b{position:absolute;inset:0;background:linear-gradient(135deg,#f3d9a4,#e0bd7a);border-radius:10px}
.env .f{position:absolute;left:0;right:0;top:0;height:90px;background:linear-gradient(180deg,#e0bd7a,#c9a55a);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;border-radius:10px 10px 0 0}
.env.open{animation:none;transform:rotateX(10deg)}.env.open .f{transform:rotateX(180deg)}
.env span{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#6a4a10;font-weight:800}
.paper{background:linear-gradient(180deg,#fffbe9,#f5ecd0);color:#3a2a10;border-radius:14px;padding:22px;max-width:340px;white-space:pre-wrap;text-align:left;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.box{animation:fl 2s ease-in-out infinite}.box.shake{animation:sh .15s infinite}
@keyframes sh{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#ffc24d,#f09a14);color:#2a1600;padding:12px 22px;border-radius:14px;font-weight:800;font-size:14px;z-index:500;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}}
.map-card{height:120px;border-radius:18px;display:flex;align-items:flex-end;padding:14px;font-weight:800;font-size:15px;text-align:left;text-shadow:0 2px 8px rgba(0,0,0,.8);cursor:pointer;transition:transform .3s;box-shadow:0 10px 28px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.12);position:relative;overflow:hidden}
.map-card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 20px 40px rgba(255,176,46,.3)}
.menu-wrap{max-width:780px;margin:0 auto}
.menu-grid{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;margin-top:16px;align-items:start}
.menu-side{display:flex;flex-direction:column;gap:8px}
.profile-mini{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--stroke);border-radius:18px;padding:12px;text-align:center}
.profile-mini .nm{font-weight:800;font-size:14px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-mini .rk{font-size:11px;color:var(--mut);display:flex;justify-content:center;align-items:center;gap:3px;margin-top:4px}
.menu-center{display:flex;flex-direction:column;align-items:center;gap:12px}
.play-btn{font-size:26px;padding:18px 40px;border-radius:24px;font-family:Impact,sans-serif;letter-spacing:3px;width:100%;max-width:230px;background:linear-gradient(180deg,#ffd166,#ffb02e 40%,#e88a00);box-shadow:0 7px 0 #8a4e00,0 10px 40px rgba(255,176,46,.5);animation:playP 2s ease-in-out infinite}
@keyframes playP{50%{transform:scale(1.03)}}
#battle-root{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;overflow:hidden}
#battle-hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(14px);border:1px solid var(--stroke);border-radius:16px;color:#fff;font-weight:bold;font-size:15px;z-index:2}
#battle-hud>div{display:flex;align-items:center;gap:5px}
#battle-hud .exit-btn{background:rgba(255,60,60,.25);padding:8px 14px;border-radius:12px;color:#fff;font-size:14px;border:1px solid rgba(255,60,60,.4)}
#arena{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:12px;padding:14px;overflow-y:auto;align-content:flex-start;position:relative;z-index:2}
#battle-controls{display:flex;justify-content:space-between;padding:0 24px 28px;align-items:center;position:relative;z-index:2}
#btn-shoot{width:82px;height:82px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd166,#ffb02e 40%,#a56200 100%);border:4px solid #000;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 6px 0 #5c3800,0 10px 30px rgba(255,176,46,.5);transition:transform .1s}
#btn-shoot:active{transform:scale(.92) translateY(2px)}
#btn-super{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff6666,#c40000 40%,#440000 100%);border:4px solid #000;color:#fff;font-size:12px;font-weight:bold;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 6px 0 #440000,0 10px 30px rgba(255,60,60,.5);transition:transform .1s}
#btn-super:active{transform:scale(.92) translateY(2px)}
#reactions{display:flex;gap:10px;justify-content:center;padding:0 20px 10px;z-index:2}
.rbtn{background:rgba(36,22,64,.7);border-radius:50%;width:46px;height:46px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.14);box-shadow:0 4px 12px rgba(0,0,0,.3)}
#mm-screen{position:fixed;inset:0;background:radial-gradient(circle at 30% 30%,rgba(107,63,160,.6),transparent 60%),radial-gradient(circle at 70% 70%,rgba(255,95,162,.4),transparent 60%),#0a0418;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.mm-title{font:900 42px/1 Impact;background:linear-gradient(180deg,#ffe38a,#ffb02e 50%,#d97700);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px;margin:0 0 8px}
.mm-sub{color:var(--mut);font-size:14px;margin-bottom:28px}
.mm-players{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:360px;margin-bottom:24px}
.mm-player{width:56px;height:64px;background:var(--glass);border-radius:12px;border:2px solid rgba(255,255,255,.14);overflow:hidden;display:flex;align-items:center;justify-content:center;animation:pop .4s both}
.mm-player.bot{border-color:var(--pk)}
.mm-loading{width:220px;height:8px;background:rgba(10,4,24,.8);border-radius:99px;overflow:hidden;margin-bottom:16px}
.mm-loading div{height:100%;background:linear-gradient(90deg,var(--pk),var(--ac),var(--cy));animation:mmbar 3.2s linear forwards;border-radius:99px}
@keyframes mmbar{to{width:100%}}
.mm-hint{color:var(--mut);font-size:13px}
#victory{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;animation:pop .5s}
#victory .v-title{font:900 clamp(38px,8vw,64px) Impact;background:linear-gradient(180deg,#ffe38a,#ffb02e,#d97700);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px;margin:0 0 20px;filter:drop-shadow(0 4px 0 #7a3b00);animation:vScale .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes vScale{from{transform:scale(0.3);opacity:0}}
#victory.lose .v-title{background:linear-gradient(180deg,#aaa,#666);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #333)}
.v-card{background:var(--glass);backdrop-filter:blur(20px);border:2px solid var(--ac);border-radius:24px;padding:22px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px rgba(255,176,46,.4)}
.v-rank{font-size:18px;font-weight:bold;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.v-bar{height:18px;background:rgba(10,4,24,.8);border:2px solid var(--stroke);border-radius:99px;overflow:hidden;margin:10px 0;position:relative}
.v-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pk),var(--ac),var(--cy));width:0;transition:width 1.5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 20px rgba(255,176,46,.8)}
.v-bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}
.v-rewards{display:flex;justify-content:center;gap:16px;margin:14px 0;flex-wrap:wrap}
.v-reward{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,176,46,.1);border:1px solid rgba(255,176,46,.3);border-radius:14px;padding:10px 14px;animation:vPop .5s both}
@keyframes vPop{from{opacity:0;transform:scale(0.5)}}
.v-reward b{font-size:18px;color:var(--ac)}.v-reward small{font-size:11px;color:var(--mut)}
.v-buttons{display:flex;gap:10px;margin-top:20px;width:100%}
.v-buttons button{flex:1;padding:14px}
.v-rematch-info{color:var(--mut);font-size:12px;margin-top:8px;min-height:16px}
@media (max-width:640px){
  .menu-grid{grid-template-columns:1fr;gap:10px}
  .menu-center{order:-1}
  .menu-side{flex-direction:row;flex-wrap:wrap}
  .menu-side button,.menu-side .profile-mini{flex:1;min-width:calc(50% - 4px)}
  .mm-title{font-size:32px}
}
</style>
</head>

async function joinRoomByCode(code){
  if(!code){sfx.error();return toast("Нет кода")}
  const s=await get(ref(db,"rooms/"+code));
  if(!s.exists()){sfx.error();return toast("Комната не найдена")}
  const r=s.val();
  if(r.status!=="lobby"){sfx.error();return toast("Игра уже идёт")}
  if(Object.keys(r.players||{}).length>=20){sfx.error();return toast("Комната полная")}
  if(cur==="battle")cleanupBattle();
  if(roomCode&&roomCode!==code){
    try{await remove(ref(db,"rooms/"+roomCode+"/players/"+nk))}catch(e){}
    roomUnsub&&roomUnsub();battleUnsub&&battleUnsub();
  }
  const pRef=ref(db,"rooms/"+code+"/players/"+nk);
  await set(pRef,{nick:U.nick,id:U.id,rank:rank(U),eq:U.eq||{},hp:200,kills:0,alive:true,superCharge:0,poopLvl:U.poopLvl||1});
  onDisconnect(pRef).remove();
  roomCode=code;listenRoom();go("lobby");
}

function startQuickMatch(mapId,training){
  isTraining=!!training;
  const totalPlayers=mode;
  const old=$("#mm-screen");if(old)old.remove();
  const mm=document.createElement("div");
  mm.id="mm-screen";
  mm.innerHTML=`<h1 class="mm-title">ПОИСК ИГРОКОВ</h1><div class="mm-sub">${MAPS[mapId]} · ${mode}×${mode}</div><div class="mm-players" id="mm-players"></div><div class="mm-loading"><div></div></div><div class="mm-hint" id="mm-hint">Ищем противников...</div>`;
  document.body.appendChild(mm);sfx.match();
  const playersEl=$("#mm-players");
  let found=1;
  const slots=[{nick:U.nick,eq:U.eq,isMe:true}];
  playersEl.innerHTML=`<div class="mm-player">${ava(U.eq,48)}</div>`;
  const addBot=()=>{
    if(found>=totalPlayers)return;
    const eq={c:rnd(35),s:rnd(35),p:rnd(30)};
    slots.push({nick:"Бот "+found,eq,bot:true});
    const div=document.createElement("div");div.className="mm-player bot";div.innerHTML=ava(eq,48);
    playersEl.appendChild(div);found++;sfx.kill();
    if(found>=totalPlayers){const h=$("#mm-hint");if(h)h.textContent="Матч найден!"}
  };
  const bt=setInterval(()=>{addBot();if(found>=totalPlayers)clearInterval(bt)},280);
  mmTimeout=setTimeout(async()=>{
    const code=Math.random().toString(36).substring(2,8).toUpperCase();
    const players={};
    slots.forEach((p,idx)=>{
      const key=p.isMe?nk:`bot_${idx}`;
      players[key]={nick:p.nick,id:p.isMe?U.id:"bot"+idx,rank:p.isMe?rank(U):1,eq:p.eq,hp:200,kills:0,alive:true,superCharge:0,bot:!!p.bot,poopLvl:p.isMe?U.poopLvl||1:1};
    });
    await set(ref(db,"rooms/"+code),{host:nk,hostId:U.id,map:mapId,mode:mode,status:"playing",startedAt:Date.now(),endAt:Date.now()+90000,training:isTraining,players});
    roomCode=code;mm.remove();listenRoom();
  },3300);
}

async function createRoomWithMap(mapId){
  const code=Math.random().toString(36).substring(2,8).toUpperCase();
  await set(ref(db,"rooms/"+code),{host:nk,hostId:U.id,map:mapId,mode:mode,status:"lobby",createdAt:Date.now(),players:{[nk]:{nick:U.nick,id:U.id,rank:rank(U),eq:U.eq||{},hp:200,kills:0,alive:true,superCharge:0,poopLvl:U.poopLvl||1}}});
  const dRef=ref(db,"rooms/"+code+"/players/"+nk);
  onDisconnect(dRef).remove();
  roomCode=code;listenRoom();go("lobby");
}

async function beginBattle(){
  if(!roomData||roomData.host!==nk)return;
  const ups={status:"playing",startedAt:Date.now(),endAt:Date.now()+90000};
  Object.keys(roomData.players||{}).forEach(p=>{
    ups[`players/${p}/hp`]=200;
    ups[`players/${p}/kills`]=0;
    ups[`players/${p}/alive`]=true;
    ups[`players/${p}/superCharge`]=0;
  });
  await update(ref(db,"rooms/"+roomCode),ups);
  startBots();
}

function listenRoom(){
  roomUnsub&&roomUnsub();
  roomUnsub=onValue(ref(db,"rooms/"+roomCode),s=>{
    if(!s.exists()){toast("Комната закрыта");cleanupBattle();roomCode=null;roomData=null;go("menu");return}
    roomData=s.val();
    if(roomData.status==="playing"){
      if(cur!=="battle")openBattle();else updateBattleUI();
      if(roomData.host===nk)startBots();
    }else if(roomData.status==="finished"){
      const v=$("#victory");
      if(cur==="battle"&&v.style.display!=="flex")showVictory();
    }else if(cur==="lobby")render();
  });
}

function openBattle(){
  cur="battle";
  const old=document.getElementById("battle-root");if(old)old.remove();
  const div=document.createElement("div");div.innerHTML=SC.battle();
  const root=div.firstElementChild;
  const mapId=roomData?roomData.map:0;
  root.style.background=`linear-gradient(135deg,${MC[mapId]})`;
  const deco=document.createElement("div");
  deco.style.cssText="position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0 15px,transparent 16px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.08) 0 12px,transparent 13px),radial-gradient(circle at 40% 80%,rgba(255,255,255,.08) 0 10px,transparent 11px)";
  root.appendChild(deco);
  document.body.appendChild(root);
  $("#app").classList.remove("on");
  setTimeout(()=>setupBattle(),30);
}

function cleanupBattle(){
  const b=document.getElementById("battle-root");if(b)b.remove();
  const v=$("#victory");if(v)v.style.display="none";
  $("#app").classList.add("on");
  if(botInterval){clearInterval(botInterval);botInterval=null}
  if(mmTimeout){clearTimeout(mmTimeout);mmTimeout=null}
  const m=document.getElementById("mm-screen");if(m)m.remove();
}

window.sendChat=async()=>{
  const t=($("#ci")?.value||"").trim();if(!t||!roomCode)return;
  $("#ci").value="";
  await push(ref(db,"rooms/"+roomCode+"/chat"),{nick:U.nick,text:t.slice(0,120),t:Date.now()});
};

function setupBattle(){
  battleUnsub&&battleUnsub();
  battleUnsub=onValue(ref(db,"rooms/"+roomCode),s=>{
    if(!s.exists()){cleanupBattle();go("menu");return}
    roomData=s.val();
    if(roomData.status==="finished"){showVictory();return}
    updateBattleUI();
  });
  const arena=document.getElementById("arena");if(!arena)return;
  arena.onclick=(e)=>{
    const card=e.target.closest("[data-player]");if(!card)return;
    const tid=card.dataset.player;if(tid===nk)return;
    const me=roomData.players[nk];if(!me||!me.alive){sfx.error();return toast("Выбыл")}
    const target=roomData.players[tid];if(!target||!target.alive||target.hp<=0)return;
    const meCard=document.querySelector(`[data-player="${nk}"]`)||document.getElementById("btn-shoot");
    const dmg=poopDmg(U);
    flyPoop(meCard,card,false,dmg);doDamage(tid,dmg,false,nk);sfx.shoot();
  };
  const shootBtn=document.getElementById("btn-shoot"),superBtn=document.getElementById("btn-super");
  if(!shootBtn||!superBtn)return;
  shootBtn.onclick=()=>{
    const me=roomData.players[nk];if(!me||!me.alive){sfx.error();return toast("Выбыл")}
    const enemies=Object.entries(roomData.players||{}).filter(([k,p])=>k!==nk&&p.alive&&p.hp>0);
    if(!enemies.length){sfx.error();return toast("Нет врагов")}
    const [tid]=enemies[rnd(enemies.length)];
    const meCard=document.querySelector(`[data-player="${nk}"]`)||shootBtn;
    const tc=document.querySelector(`[data-player="${tid}"]`);
    const dmg=poopDmg(U);
    if(tc)flyPoop(meCard,tc,false,dmg);
    doDamage(tid,dmg,false,nk);sfx.shoot();
  };
  superBtn.onclick=()=>{
    const me=roomData.players[nk];if(!me||(me.superCharge||0)<100){sfx.error();return toast("Не заряжено")}
    const enemies=Object.entries(roomData.players||{}).filter(([k,p])=>k!==nk&&p.alive&&p.hp>0);
    if(!enemies.length)return toast("Нет врагов");
    const meCard=document.querySelector(`[data-player="${nk}"]`)||shootBtn;
    const sd=poopDmg(U)*8;
    enemies.forEach(([tid])=>{
      const tc=document.querySelector(`[data-player="${tid}"]`);
      if(tc)setTimeout(()=>flyPoop(meCard,tc,true,sd),rnd(200));
      doDamage(tid,sd,true,nk);
    });
    update(ref(db,`rooms/${roomCode}/players/${nk}`),{superCharge:0});
    sfx.super();
    document.body.style.transition="transform .1s";document.body.style.transform="translate(4px,-4px)";
    setTimeout(()=>document.body.style.transform="translate(-4px,4px)",60);
    setTimeout(()=>document.body.style.transform="",120);
  };
  document.querySelectorAll("[data-r]").forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();sfx.react();
      const r=btn.dataset.r;
      const myCard=document.querySelector(`[data-player="${nk}"]`);if(!myCard)return;
      const rect=myCard.getBoundingClientRect();
      const el=document.createElement("div");
      el.style.cssText=`position:fixed;left:${rect.left+rect.width/2}px;top:${rect.top}px;pointer-events:none;z-index:200;transform:translate(-50%,0);opacity:1;transition:all 1.2s`;
      const mp={like:ico.like,love:ico.love,skull:ico.skullBig,poop:poopSVG(0,36,false)};
      el.innerHTML=mp[r].replace('width="24" height="24"','width="40" height="40"');
      document.body.append(el);
      requestAnimationFrame(()=>{el.style.transform="translate(-50%,-90px) scale(1.5)";el.style.opacity="0"});
      setTimeout(()=>el.remove(),1300);
    };
  });
  updateBattleUI();
}

function startBots(){
  if(botInterval)return;
  botInterval=setInterval(async()=>{
    if(!roomData||roomData.status!=="playing"||roomData.host!==nk)return;
    const bots=Object.entries(roomData.players||{}).filter(([k,p])=>p.bot&&p.alive&&p.hp>0);
    if(!bots.length)return;
    const [botId]=bots[rnd(bots.length)];
    const targets=Object.entries(roomData.players||{}).filter(([k,p])=>k!==botId&&p.alive&&p.hp>0);
    if(!targets.length)return;
    const [tid]=targets[rnd(targets.length)];
    const botCard=document.querySelector(`[data-player="${botId}"]`);
    const targetCard=document.querySelector(`[data-player="${tid}"]`);
    if(botCard&&targetCard)flyPoop(botCard,targetCard,false,10);
    await doDamage(tid,10,false,botId);
  },1500);
}

async function doDamage(targetId,dmg,isSuper,fromId){
  const hpRef=ref(db,`rooms/${roomCode}/players/${targetId}/hp`);
  const res=await runTransaction(hpRef,hp=>{if(hp===null||hp<=0)return hp;return Math.max(0,hp-dmg)});
  if(res.committed)sfx.hit();
  if(res.snapshot.val()===0){
    sfx.kill();
    update(ref(db,`rooms/${roomCode}/players/${targetId}`),{alive:false});
    if(fromId)runTransaction(ref(db,`rooms/${roomCode}/players/${fromId}/kills`),k=>(k||0)+1);
    if(!isSuper&&fromId)runTransaction(ref(db,`rooms/${roomCode}/players/${fromId}/superCharge`),c=>Math.min(100,(c||0)+50));
  }
}

function flyPoop(fromEl,toEl,isSuper=false,dmgValue=10){
  if(!fromEl||!toEl)return;
  const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();
  const sx=a.left+a.width/2,sy=a.top+a.height/2,ex=b.left+b.width/2,ey=b.top+b.height/2;
  const count=isSuper?14:1,dur=isSuper?0.55:0.45;
  for(let i=0;i<count;i++){
    const p=document.createElement("div");
    p.innerHTML=poopSVG(U?.eq?.p||0,isSuper?28:38,false);
    const ox=(Math.random()-.5)*(isSuper?140:0),oy=(Math.random()-.5)*(isSuper?140:0);
    p.style.cssText=`position:fixed;left:${sx}px;top:${sy}px;pointer-events:none;z-index:200;transform:translate(-50%,-50%);opacity:1;transition:transform ${dur}s cubic-bezier(.45,.05,.55,.95),opacity ${dur}s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))`;
    document.body.append(p);
    requestAnimationFrame(()=>{
      p.style.transform=`translate(calc(-50% + ${ex-sx+ox}px),calc(-50% + ${ey-sy+oy}px)) rotate(${Math.random()*720-360}deg) scale(${isSuper?1.4:1})`;
      p.style.opacity="0";
    });
    setTimeout(()=>p.remove(),dur*1000+150);
  }
  setTimeout(()=>{
    const flash=document.createElement("div");
    flash.style.cssText=`position:fixed;left:${ex}px;top:${ey}px;width:${isSuper?140:60}px;height:${isSuper?140:60}px;border-radius:50%;background:radial-gradient(circle,#ffb02e,#ff5fa2 40%,transparent 70%);pointer-events:none;z-index:199;transform:translate(-50%,-50%) scale(.3);opacity:1;transition:all .4s`;
    document.body.append(flash);
    requestAnimationFrame(()=>{flash.style.transform="translate(-50%,-50%) scale(1.6)";flash.style.opacity="0"});
    setTimeout(()=>flash.remove(),450);
    toEl.style.transition="transform .12s";toEl.style.transform="scale(.9) rotate(-3deg)";
    setTimeout(()=>{toEl.style.transform="scale(1.05) rotate(2deg)"},120);
    setTimeout(()=>{toEl.style.transform=""},240);
    const dmg=document.createElement("div");
    dmg.textContent="-"+dmgValue;
    dmg.style.cssText=`position:fixed;left:${ex}px;top:${ey-20}px;color:${isSuper?'#ff4444':'#fff'};font:900 ${isSuper?30:22}px Impact,sans-serif;pointer-events:none;z-index:200;text-shadow:0 2px 6px #000,0 0 10px ${isSuper?'#f44':'#ffb02e'};transform:translate(-50%,0);opacity:1;transition:all .9s ease-out`;
    document.body.append(dmg);
    requestAnimationFrame(()=>{dmg.style.transform="translate(-50%,-50px) scale(1.4)";dmg.style.opacity="0"});
    setTimeout(()=>dmg.remove(),1000);
    if(isSuper){
      const blast=document.createElement("div");
      blast.style.cssText="position:fixed;inset:0;background:radial-gradient(circle at center,rgba(255,176,46,.3),rgba(0,0,0,.5));z-index:150;pointer-events:none;opacity:.7;transition:opacity .5s";
      document.body.append(blast);
      requestAnimationFrame(()=>blast.style.opacity="0");
      setTimeout(()=>blast.remove(),550);
    }
  },dur*1000);
}

function updateBattleUI(){
  if(!roomData||!roomData.players)return;
  const me=roomData.players[nk];if(!me)return;
  const hpEl=document.getElementById("my-hp");
  if(hpEl){hpEl.textContent=me.hp;hpEl.style.color=me.hp>100?"#7fffa0":me.hp>50?"#ffb02e":"#ff5555"}
  const kEl=document.getElementById("my-kills");if(kEl)kEl.textContent=me.kills||0;
  const sEl=document.getElementById("super-fill");if(sEl)sEl.textContent=(me.superCharge||0)+"%";
  const fillEl=document.querySelector("#btn-super .fill");if(fillEl)fillEl.style.height=(me.superCharge||0)+"%";
  const sb=document.getElementById("btn-super");
  if(sb){const en=(me.superCharge||0)>=100;sb.disabled=!en;sb.style.opacity=en?1:.55}
  if(document.getElementById("battle-timer")&&roomData.endAt){
    const left=Math.max(0,Math.floor((roomData.endAt-Date.now())/1000));
    document.getElementById("battle-timer").textContent=`${Math.floor(left/60)}:${(left%60).toString().padStart(2,'0')}`;
  }
  const arena=document.getElementById("arena");
  if(arena){
    arena.innerHTML=Object.entries(roomData.players).map(([k,p])=>{
      const isMe=k===nk,dead=!p.alive||p.hp<=0,hpPct=Math.max(0,p.hp/2);
      const eq=p.eq||{};
      return `<div data-player="${k}" style="background:${isMe?'rgba(58,42,94,.85)':p.bot?'rgba(42,26,68,.85)':'rgba(36,22,64,.85)'};backdrop-filter:blur(10px);border-radius:16px;padding:10px;text-align:center;opacity:${dead?.35:1};border:2px solid ${isMe?'#ffb02e':p.bot?'rgba(255,95,162,.6)':'rgba(255,255,255,.1)'};min-width:100px;cursor:${isMe?'default':'crosshair'};transition:transform .2s"><div style="margin:0 auto;width:60px;height:75px;overflow:hidden">${ava(eq,60,eq.p)}</div><div style="font-size:12px;font-weight:bold">${esc(p.nick)}${isMe?' (Ты)':''}</div><div style="height:8px;background:rgba(0,0,0,.6);border-radius:4px;margin:5px 0;overflow:hidden"><div style="height:100%;width:${hpPct}%;background:${p.hp>100?'linear-gradient(90deg,#3b5,#7fffa0)':p.hp>50?'linear-gradient(90deg,#fc3,#ffd166)':'linear-gradient(90deg,#e33,#ff6666)'};transition:width .3s"></div></div><div style="font-size:11px;color:#a899c8;display:flex;justify-content:center;gap:6px">${ico.heart}${p.hp} · ${ico.skull}${p.kills||0}</div></div>`;
    }).join("");
  }
  if(roomData.host===nk&&roomData.status==="playing"){
    const alive=Object.entries(roomData.players).filter(([k,p])=>p.alive&&p.hp>0);
    if(alive.length<=1){
      const w=alive.length===1?alive[0][0]:null;
      update(ref(db,"rooms/"+roomCode),{status:"finished","gameState/winner":w});
    }else if(Date.now()>roomData.endAt){
      const sorted=Object.entries(roomData.players).sort((a,b)=>(b[1].kills||0)-(a[1].kills||0));
      update(ref(db,"rooms/"+roomCode),{status:"finished","gameState/winner":sorted[0]?sorted[0][0]:null});
    }
  }
}

async function showVictory(){
  const v=$("#victory");
  if(!roomData||v.style.display==="flex")return;
  const sorted=Object.entries(roomData.players||{}).sort((a,b)=>(b[1].kills||0)-(a[1].kills||0));
  const mvp=sorted[0];
  const winner=roomData.gameState?.winner;
  const isWin=winner===nk;
  const awarded=localStorage.getItem("gd_lastwin_"+roomCode);
  const wasTraining=roomData.training;
  let gainedPts=0,gainedCoins=0,gainedUp=0;
  if(isWin&&!awarded){
    localStorage.setItem("gd_lastwin_"+roomCode,"1");
    if(!wasTraining){
      gainedPts=25;gainedCoins=50;gainedUp=30;
      await add("pts",gainedPts);await add("coins",gainedCoins);await add("up",gainedUp);
    }
  }
  if(wasTraining)await upd({trained:true});
  const freshSnap=await get(ref(db,"users/"+nk));
  const freshU=freshSnap.val()||U;
  const currentPts=freshU.pts||0;
  const currentRank=rank({...freshU,pts:currentPts-gainedPts});
  const newRank=rank(freshU);
  const oldPct=(currentPts-gainedPts)%100;
  const newPct=currentPts%100;
  const rankUp=newRank>currentRank;
  v.className=isWin?"":"lose";v.style.display="flex";
  const rematchVotes=roomData.rematch?.votes||{};
  const totalPlayers=Object.keys(roomData.players||{}).length;
  const votesCount=Object.values(rematchVotes).filter(v=>v).length;
  const myVoted=rematchVotes[nk];
  v.innerHTML=`<h1 class="v-title">${isWin?"ТЫ ВЫИГРАЛ!":"ТЫ ПРОИГРАЛ"}</h1><div class="v-card">${mvp?`<div style="margin:0 auto;width:90px;height:100px;overflow:hidden">${ava(mvp[1].eq,90,mvp[1].eq?.p)}</div>`:''}<div style="font-weight:800;font-size:18px;margin-top:8px">${esc(mvp?mvp[1].nick:U.nick)}</div>${!wasTraining?`<div class="v-rank"><span>Ранг</span><span>${currentRank} → <b style="color:var(--ac)">${newRank}</b></span></div><div class="v-bar"><i id="rank-fill" style="width:${oldPct}%"></i><span>${oldPct}/100</span></div>${rankUp?`<div style="color:var(--ac);font-weight:900;font-size:20px;margin:8px 0;animation:vPop .5s .8s both">🎉 ПОВЫШЕНИЕ РАНГА!</div>`:''}${isWin?`<div class="v-rewards"><div class="v-reward">${ico.star}<b>+${gainedPts}</b><small>ранга</small></div><div class="v-reward">${ico.coin}<b>+${gainedCoins}</b><small>монет</small></div><div class="v-reward">${ico.up}<b>+${gainedUp}</b><small>улуч.</small></div></div>`:''}`:'<div style="color:var(--mut);margin:10px 0">Тренировка завершена</div>'}<div class="v-rematch-info" id="rematch-info">${votesCount}/${totalPlayers} за реванш</div><div class="v-buttons"><button class="g" data-a="leaveBattle">В МЕНЮ</button><button data-a="rematchVote" ${myVoted?"disabled":""}>${myVoted?"✓ Голос дан":"🔄 ЕЩЁ"}</button></div></div>`;
  if(isWin)sfx.win();else sfx.lose();
  if(!wasTraining){
    setTimeout(()=>{
      const fill=$("#rank-fill");
      if(fill){
        if(rankUp){
          fill.style.width="100%";
          setTimeout(()=>{
            fill.style.transition="none";fill.style.width="0%";
            setTimeout(()=>{
              fill.style.transition="width 1.5s cubic-bezier(.4,0,.2,1)";
              fill.style.width=newPct+"%";
              const span=fill.parentElement.querySelector("span");if(span)span.textContent=newPct+"/100";
            },50);
          },1500);
        }else fill.style.width=newPct+"%";
        const span=fill.parentElement.querySelector("span");if(span)span.textContent=newPct+"/100";
      }
    },300);
  }
  rematchUnsub&&rematchUnsub();
  rematchUnsub=onValue(ref(db,"rooms/"+roomCode+"/rematch"),s=>{
    const votes=s.val()?.votes||{};
    const count=Object.values(votes).filter(v=>v).length;
    const info=document.getElementById("rematch-info");
    if(info)info.textContent=`${count}/${totalPlayers} за реванш`;
    if(count>=totalPlayers)startRematch();
  });
}

async function startRematch(){
  if(!roomCode)return;
  const ups={status:"playing",startedAt:Date.now(),endAt:Date.now()+90000,rematch:null};
  Object.keys(roomData.players||{}).forEach(p=>{
    ups[`players/${p}/hp`]=200;
    ups[`players/${p}/kills`]=0;
    ups[`players/${p}/alive`]=true;
    ups[`players/${p}/superCharge`]=0;
  });
  await update(ref(db,"rooms/"+roomCode),ups);
  $("#victory").style.display="none";openBattle();
}

async function leaveCurrentMatch(){
  if(roomCode)await remove(ref(db,"rooms/"+roomCode+"/players/"+nk));
  roomUnsub&&roomUnsub();battleUnsub&&battleUnsub();rematchUnsub&&rematchUnsub();
  cleanupBattle();roomCode=null;roomData=null;
}

  document.getElementById("upd-close").onclick=async()=>{
    await update(ref(db,"users/"+nk),{upNotif:true});
    await add("gems",500);
    sfx.coin();modal.remove();toast("Получено 500 гемов!");
  };

function start(n,scr){
  nk=n;localStorage.setItem("gd_nk",n);
  unsub&&unsub();inviteUnsub&&inviteUnsub();
  unsub=onValue(ref(db,"users/"+n),s=>{
    U=s.val();if(!U)return;
    const mig={};
    if(U.poopLvl===undefined)mig.poopLvl=U.admin?20:1;
    if(U.up===undefined)mig.up=U.admin?999999:0;
    if(Object.keys(mig).length){update(ref(db,"users/"+n),mig);return}
    const first=cur==="auth";
    if(first)go(scr||"menu");else render();
    gate();mail();
    if(!U.upNotif&&first&&!scr)setTimeout(()=>showUpdateNotification(),800);
  });
  inviteUnsub=onValue(ref(db,"users/"+n+"/invites"),s=>{
    const inv=s.val();
    if(!inv||!U)return;
    if(cur==="battle")return;
    const entries=Object.entries(inv).filter(([k,v])=>v&&Date.now()-v.t<300000);
    if(entries.length&&!document.getElementById("invite-popup"))showInvitePopup(entries[0][0],entries[0][1]);
  });
}

function gate(){
  const b=$("#blk");let h="";
  if(U.ban>Date.now())h=`<h2>Ты забанен</h2><p>Осталось ${Math.ceil((U.ban-Date.now())/60000)} мин.</p>`;
  else if(closed&&!U.admin)h=`<h2>Игра закрыта</h2><p>${esc(closed.reason)}</p>`;
  b.innerHTML=h;b.style.display=h?"flex":"none";
}
onValue(ref(db,"meta/closed"),s=>{closed=s.val();U&&gate()});

let lo=false;
function mail(){
  if(lo||!U.mail)return;
  const e=Object.entries(U.mail).find(([k,m])=>!m.r);
  if(!e)return;
  lo=true;
  const o=$("#lt");
  o.innerHTML=`<div class="env" id="en"><div class="b"></div><div class="f"></div><span>Нажми на меня</span></div>`;
  o.style.display="flex";
  $("#en").onclick=()=>{
    $("#en").classList.add("open");sfx.mail();
    setTimeout(()=>{
      o.innerHTML=`<div class="paper"><b>Письмо от разработчика</b>\n\n${esc(e[1].text)}\n\n— С уважением, Малик продакшн</div><button style="margin-top:14px" id="lc">Закрыть</button>`;
      $("#lc").onclick=()=>{o.style.display="none";lo=false;update(ref(db,`users/${nk}/mail/${e[0]}`),{r:true})};
    },900);
  };
}

let skip=false;const sl=ms=>skip?0:new Promise(r=>setTimeout(r,ms));
async function intro(){
  const o=$("#intro"),t=$("#it");o.style.display="flex";$("#skip").onclick=()=>skip=true;
  const say=async(h,hold=1700,c="")=>{if(skip)return;t.className=c;t.innerHTML=h;t.style.opacity=1;await sl(hold);t.style.opacity=0;await sl(1000)};
  await say("МАЛИК ПРОДАКШН<br><small>представляет…</small>",2000);
  for(const n of[3,2,1]){sfx.kill();await say(n,200,"num")}
  await say("Самая интересная игра<br>во всём мире",2000);
  await say("Этой игрой интересовался<br>сам Игорь Синюшный",2000);
  await say(`${poopSVG(0,110,1)}<h1>ГОВНОДАВЫ</h1>`,2000,"big");
  for(const l of["Это не просто игра. Это повышение твоего айкью.","Ты станешь умнее, и на тебя будут смотреть девушки и парни.","В тот же день, как начнёшь играть, ты найдёшь отношения.","Тебе напишет Илон Макс и подарит новую Теслу.","А самое главное — уважение."])await say(l,2200);
  o.style.opacity=0;await new Promise(r=>setTimeout(r,800));o.style.display="none";
  localStorage.setItem("gd_intro","1");
}

(async()=>{
  try{
    for(const a of ADMINS){
      const s=await get(ref(db,"users/"+a.nick));
      if(!s.exists()){
        await set(ref(db,"ids/"+a.id),a.nick);
        const own={};
        for(const t in IT){for(let i=0;i<IT[t].N;i++)own[t+i]=1}
        for(const cat in LIMITED_SKINS){for(const sk of LIMITED_SKINS[cat])own[cat+sk.idx]=1}
        await set(ref(db,"users/"+a.nick),{id:a.id,nick:a.nick,hash:a.hash,admin:true,desc:"Создатель игры",coins:999999,gems:99999,pts:1000000,up:999999,poopLvl:20,own,eq:{c:35,s:35,p:35},medals:{m0:"Создатель игры",m1:"Ветеран игры"},label:"разраб",friends:{},friendReqs:{},sentReqs:{},trained:true,t:Date.now()});
      }else{
        const u=s.val();
        if(u.poopLvl===undefined||u.up===undefined||u.admin){
          const own=u.own||{};
          for(const cat in LIMITED_SKINS){for(const sk of LIMITED_SKINS[cat])own[cat+sk.idx]=1}
          await update(ref(db,"users/"+a.nick),{poopLvl:20,up:999999,own});
        }
      }
    }
    if(!localStorage.getItem("gd_intro"))await intro();
    if(nk&&(await get(ref(db,"users/"+nk))).exists())start(nk);
    else{cur="auth";go("auth")}
  }catch(e){
    console.error("Init error:",e);
    cur="auth";go("auth");
  }
})();
</script>
